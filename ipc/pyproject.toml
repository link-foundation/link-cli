[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "link-cli-ipc"
version = "0.1.0"
description = "Optional composable native IPC byte-stream layers for clink"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = []

[project.scripts]
clink-ipc = "link_ipc.__main__:main"

[tool.setuptools.packages.find]
include = ["link_ipc*"]
