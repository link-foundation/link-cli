# zizmor configuration for the workflow security audit run by
# `.github/workflows/workflows.yml` -- https://docs.zizmor.sh/configuration/
#
# Union of the unpinned-uses policies of the C#, Rust and JS
# ai-driven-development-pipeline templates, because this repository ships all
# three languages (issue #134).
#
# Blanket policy: third-party actions must be pinned to a commit hash, because
# a mutable tag or branch of a repository we do not control is arbitrary code
# execution in any job that holds credentials. Namespaces we do trust to keep
# their release tags immutable are allowed to stay on a readable ref.
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        docker/*: ref-pin
        oven-sh/*: ref-pin
        codecov/*: ref-pin
        lycheeverse/*: ref-pin
        peter-evans/*: ref-pin
        zizmorcore/*: ref-pin
        '*': hash-pin
  # .github/workflows/dependencies.yml fails while any dependency is behind
  # its latest release (the requirement of PR #106), so Dependabot has to open
  # the update the day it is released. A cooldown would keep that check red
  # for the whole cooldown window. The supply-chain risk a cooldown mitigates
  # is covered instead by the lockfiles, `--locked` installs and the review of
  # every Dependabot pull request before it merges.
  dependabot-cooldown:
    disable: true
