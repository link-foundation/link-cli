name: Production source

# dev/log and docs/case-studies keep verbatim copies of other repositories
# (the pipeline templates compared in issues #86, #92 and #134) and other
# investigation evidence. They are not built or shipped from here; analysing
# them logged "semantic analyzer unavailable (no manifest found)" for every
# copied Rust script and would turn their code into alerts of this repository.
# Ported from the rust-ai-driven-development-pipeline-template.
#
# The Rust and C# files under experiments/ are single-file probes run by hand
# with rustc or a throwaway project. No manifest or solution includes them, so
# extracting them only reports missing manifests and unresolved references.
#
# Each C# example is its own project with top-level statements. CodeQL's
# no-build mode compiles every file together, where only one file may have them,
# so it reports a compiler error for each example. csharp.yml builds them instead.
paths-ignore:
  - dev/log
  - docs/case-studies
  - experiments/**/*.rs
  - experiments/**/*.cs
  - examples/*-csharp/**
