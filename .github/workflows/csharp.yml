name: C# CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'csharp/**'
      - 'csharp/scripts/**'
      - '.github/workflows/csharp.yml'
      - '.github/scripts/coverage*'
      - '.github/scripts/check-sqlite-optional.mjs'
      - 'docs/protocol/native-pages*'
      - 'docs/protocol/native-lsm-wal*'
      - 'docs/protocol/checkpoint*'
      - 'docs/protocol/journal-maintenance-v1.json'
      - 'docs/protocol/reclamation-v1.json'
      - 'docs/protocol/chunked-journal*'
      - 'docs/protocol/reclaiming-chunks*'
      - 'docs/protocol/causal-*'
      - 'examples/cluster-csharp/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
          - verify-trusted-publishing
      nuget_user:
        description: 'NuGet account for authentication-only verification (defaults to NUGET_USER)'
        required: false
        type: string
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Concurrency is set per job (issue #134): superseded read-only checks are
# cancelled on pull requests, while writer jobs share a never-cancelled
# group. A workflow-level group held the whole run, including the release
# and the registry wait, so a third push to main cancelled the queued run.

# Least privilege by default; the publishing jobs opt into more below.
permissions:
  contents: read

# The GIT_CONFIG_* entries provide Git config to actions/checkout itself;
# checkout runs git init before any workflow step can configure Git, which
# otherwise prints the default-branch hint into every log.
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

defaults:
  run:
    working-directory: csharp

jobs:
  # Authenticate without a version commit, tag, or package upload. The input
  # allows verification before setting NUGET_USER (which enables OIDC releases).
  verify-trusted-publishing:
    name: Verify NuGet trusted publishing
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'verify-trusted-publishing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-verify-trusted-publishing
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Validate NuGet account
        working-directory: .
        env:
          NUGET_USER: ${{ vars.NUGET_USER || inputs.nuget_user }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo '::error::Supply nuget_user or set NUGET_USER to the account owning the trusted publishing policy on nuget.org.'
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: auth
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || inputs.nuget_user }}

      - name: Confirm short-lived credential
        working-directory: .
        env:
          NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          echo 'NuGet OIDC authentication succeeded; the temporary push key expires in one hour.' >> "$GITHUB_STEP_SUMMARY"

  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name != 'workflow_dispatch'
    outputs:
      cs-changed: ${{ steps.changes.outputs.cs-changed }}
      csproj-changed: ${{ steps.changes.outputs.csproj-changed }}
      sln-changed: ${{ steps.changes.outputs.sln-changed }}
      props-changed: ${{ steps.changes.outputs.props-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
      csharp-code-changed: ${{ steps.changes.outputs.csharp-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node csharp/scripts/detect-code-changes.mjs

  # === CHANGESET CHECK - only runs on PRs with code changes ===
  changeset-check:
    name: Changeset Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changeset-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.csharp-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Validate changeset
        working-directory: .
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Read head_ref through env, never interpolate it into the script: on
          # a fork PR the branch name is attacker-controlled (issue #134).
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip changeset check for automated release PRs
          if [[ "$GITHUB_HEAD_REF" == "changeset-release/"* ]] || [[ "$GITHUB_HEAD_REF" == "changeset-manual-release-"* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi

          # A C# code change without exactly one valid changeset never reaches
          # a release, so this fails instead of warning (issue #134).
          node csharp/scripts/validate-changeset.mjs

  # === LINT AND FORMAT CHECK ===
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes]
    if: |
      !cancelled() && inputs.release_mode != 'verify-trusted-publishing' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.cs-changed == 'true' ||
        needs.detect-changes.outputs.csproj-changed == 'true' ||
        needs.detect-changes.outputs.sln-changed == 'true' ||
        needs.detect-changes.outputs.props-changed == 'true' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run release script tests
        working-directory: .
        run: node --test csharp/scripts/*.test.mjs

      - name: Run workflow policy tests
        working-directory: .
        run: node --test .github/scripts/*.test.mjs

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify core library has no SQLite provider
        run: node ../.github/scripts/check-sqlite-optional.mjs csharp

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check file sizes
        working-directory: .
        run: node csharp/scripts/check-file-size.mjs

  # === TEST ON MULTIPLE OS ===
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, changeset-check]
    if: ${{ !cancelled() && inputs.release_mode != 'verify-trusted-publishing' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage;Format=json,cobertura"

      - name: Native file LSM cluster consumers
        working-directory: .
        run: |
          dotnet build examples/cluster-csharp --configuration Release
          dotnet run --project examples/cluster-csharp --configuration Release --no-build -- --native-lsm direct
          dotnet run --project examples/cluster-csharp --configuration Release --no-build -- --native-lsm partitioned
          dotnet run --project examples/cluster-csharp --configuration Release --no-build -- --native-lsm chunks
          dotnet run --project examples/cluster-csharp --configuration Release --no-build -- --native-lsm reclaiming
          dotnet run --project examples/cluster-csharp --configuration Release --no-build -- --native-lsm reclaiming-chunks

      - name: Setup Node.js for coverage
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Write coverage summary
        if: ${{ !cancelled() }}
        working-directory: .
        run: node .github/scripts/coverage.mjs summary csharp/Foundation.Data.Doublets.Cli.Tests/TestResults

      - name: Retain raw and Cobertura reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'ubuntu-24.04' && 'csharp-coverage' || format('csharp-coverage-{0}', matrix.os) }}
          path: |
            csharp/Foundation.Data.Doublets.Cli.Tests/TestResults/**/coverage.cobertura.xml
            csharp/Foundation.Data.Doublets.Cli.Tests/TestResults/**/coverage.json
          if-no-files-found: error

      # Only an explicitly inactive/missing Codecov repository relaxes upload
      # errors. The preflight prints the reason as a warning; once activated,
      # failed uploads fail CI. Coverage is retained independently above.
      - name: Check Codecov activation
        id: codecov
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .
        run: node .github/scripts/coverage.mjs codecov

      - name: Upload coverage to Codecov (OIDC)
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 5
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          directory: csharp/Foundation.Data.Doublets.Cli.Tests/TestResults
          plugins: noop
          fail_ci_if_error: ${{ steps.codecov.outputs.required }}

  # === SEMANTIC MERGE CONFLICT CHECK ===
  # The jobs above test the pull request head. Two pull requests that each pass
  # can still break `main` once merged, because a clean textual merge does not
  # imply a compiling one (issue #96). This job merges the head into the current
  # tip of the base branch and rebuilds and retests that tree.
  fresh-merge:
    name: Simulate Fresh Merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-fresh-merge
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name == 'pull_request'
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      # The script rewrites the working tree (detached checkout + merge), so it
      # has to run from the repository root, not from the csharp/ default.
      - name: Simulate fresh merge with base branch
        working-directory: .
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          FRESH_MERGE_CHECKS: |
            dotnet build csharp --configuration Release
            dotnet test csharp --no-build --configuration Release --verbosity normal
        run: bash .github/scripts/simulate-fresh-merge.sh

  # === BUILD PACKAGE ===
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      - name: Pack NuGet package
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: csharp/artifacts/*.nupkg

  # === AUTOMATIC RELEASE ===
  release:
    name: Release
    needs: [lint, test, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Writer group: never cancel a release that may already have pushed a
    # package or a version commit.
    concurrency:
      group: csharp-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      # NuGet trusted publishing (NuGet/login) exchanges the OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check for changesets
        id: check_changesets
        working-directory: .
        run: |
          # Count changeset files (excluding README.md and config.json)
          CHANGESET_COUNT=$(find csharp/.changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          echo "Found $CHANGESET_COUNT changeset file(s)"
          echo "has_changesets=$([[ $CHANGESET_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "changeset_count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Check if release is needed
        # Self-healing gate: even when a changeset is absent, resume publishing
        # if the csproj <Version> is missing on NuGet or its GitHub release does
        # not exist. See docs/case-studies/issue-84/README.md and the JS
        # template's check-release-needed.mjs for the same pattern.
        id: check_release
        working-directory: .
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node csharp/scripts/check-release-needed.mjs

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        working-directory: .
        run: |
          echo "Multiple changesets detected, merging..."
          node csharp/scripts/merge-changesets.mjs \
            --dir csharp/.changeset \
            --package-name Foundation.Data.Doublets.Cli

      - name: Version and commit
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        working-directory: .
        run: node csharp/scripts/version-and-commit.mjs --mode changeset

      - name: Resolve release version
        # Picks the version that downstream steps should publish. Prefers the
        # one just committed; falls back to the csproj <Version> reported by
        # check-release-needed for self-healing re-runs.
        id: release_version
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.check_release.outputs.current_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            VERSION="$NEW_VERSION"
          else
            VERSION="$CURRENT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Build release package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Resolve NuGet package ids
        id: package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        run: |
          CLI_ID=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' Foundation.Data.Doublets.Cli/Foundation.Data.Doublets.Cli.csproj | head -n 1)
          if [ -z "$CLI_ID" ]; then
            CLI_ID=clink
          fi
          LIB_ID=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' Foundation.Data.Doublets.Cli.Library/Foundation.Data.Doublets.Cli.Library.csproj | head -n 1)
          if [ -z "$LIB_ID" ]; then
            LIB_ID=Foundation.Data.Doublets.Cli
          fi
          echo "id=$CLI_ID" >> "$GITHUB_OUTPUT"
          echo "library_id=$LIB_ID" >> "$GITHUB_OUTPUT"

      - name: Validate NuGet API key
        # Upfront validation surfaces an expired/invalid NUGET_API_KEY before
        # we attempt a push that would otherwise return HTTP 403 mid-flight.
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "Publishing with NuGet trusted publishing as $NUGET_USER"
            exit 0
          fi
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error title=NuGet credentials are missing::The release was versioned but cannot be published to NuGet. Either configure a nuget.org trusted publishing policy for this repository and csharp.yml and set the NUGET_USER repository variable to the nuget.org account name, or add a nuget.org API key with push access to the clink and Foundation.Data.Doublets.Cli packages as the NUGET_API_KEY repository secret (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          echo "NUGET_API_KEY length: ${#NUGET_API_KEY}"

      - name: NuGet login (OIDC)
        id: nuget-login
        # Trusted publishing: a one-hour key requested right before the push.
        if: >-
          vars.NUGET_USER != '' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true'))
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        id: nuget_publish
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        env:
          # The long-lived secret is only the fallback while trusted
          # publishing is not configured (vars.NUGET_USER unset).
          NUGET_API_KEY: ${{ vars.NUGET_USER == '' && secrets.NUGET_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # A missing key used to skip the push while the release stayed green
          # (issue #134); a versioned but unpublished release must fail.
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error title=NuGet credentials are missing::The release was versioned but cannot be published to NuGet. Either configure a nuget.org trusted publishing policy for this repository and csharp.yml and set the NUGET_USER repository variable to the nuget.org account name, or add a nuget.org API key with push access to the clink and Foundation.Data.Doublets.Cli packages as the NUGET_API_KEY repository secret (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          # zizmor flags every --api-key push; the key is the short-lived
          # trusted-publishing key whenever vars.NUGET_USER is set.
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate # zizmor: ignore[use-trusted-publishing]
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify CLI package on NuGet
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true'))
        env:
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node scripts/wait-for-nuget.mjs \
            --package-id "$PACKAGE_ID" \
            --release-version "$RELEASE_VERSION"

      - name: Verify library package on NuGet
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true'))
        env:
          PACKAGE_ID: ${{ steps.package.outputs.library_id }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node scripts/wait-for-nuget.mjs \
            --package-id "$PACKAGE_ID" \
            --release-version "$RELEASE_VERSION"

      - name: Create GitHub Release
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          CLI_PACKAGE_ID: ${{ steps.package.outputs.id }}
          LIBRARY_PACKAGE_ID: ${{ steps.package.outputs.library_id }}
        working-directory: .
        run: |
          node csharp/scripts/create-github-release.mjs \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-prefix "csharp-v" \
            --language "C#" \
            --package-id "$CLI_PACKAGE_ID" \
            --package-id "$LIBRARY_PACKAGE_ID" \
            --changelog-path "csharp/CHANGELOG.md" \
            --assets-glob "csharp/artifacts/*.nupkg"

  # === MANUAL INSTANT RELEASE ===
  instant-release:
    name: Instant Release
    needs: [lint, test, build]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Writer group: never cancel a release that may already have pushed a
    # package or a version commit.
    concurrency:
      group: csharp-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      # NuGet trusted publishing (NuGet/login) exchanges the OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Version and commit
        id: version
        working-directory: .
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          node csharp/scripts/version-and-commit.mjs \
            --mode instant \
            --bump-type "$BUMP_TYPE" \
            --description "$DESCRIPTION"

      - name: Build package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Resolve NuGet package ids
        id: package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        run: |
          CLI_ID=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' Foundation.Data.Doublets.Cli/Foundation.Data.Doublets.Cli.csproj | head -n 1)
          if [ -z "$CLI_ID" ]; then
            CLI_ID=clink
          fi
          LIB_ID=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' Foundation.Data.Doublets.Cli.Library/Foundation.Data.Doublets.Cli.Library.csproj | head -n 1)
          if [ -z "$LIB_ID" ]; then
            LIB_ID=Foundation.Data.Doublets.Cli
          fi
          echo "id=$CLI_ID" >> "$GITHUB_OUTPUT"
          echo "library_id=$LIB_ID" >> "$GITHUB_OUTPUT"

      - name: NuGet login (OIDC)
        id: nuget-login
        # Trusted publishing: a one-hour key requested right before the push.
        if: >-
          vars.NUGET_USER != '' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        id: nuget_publish
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        env:
          # The long-lived secret is only the fallback while trusted
          # publishing is not configured (vars.NUGET_USER unset).
          NUGET_API_KEY: ${{ vars.NUGET_USER == '' && secrets.NUGET_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # A missing key used to skip the push while the release stayed green
          # (issue #134); a versioned but unpublished release must fail.
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error title=NuGet credentials are missing::The release was versioned but cannot be published to NuGet. Either configure a nuget.org trusted publishing policy for this repository and csharp.yml and set the NUGET_USER repository variable to the nuget.org account name, or add a nuget.org API key with push access to the clink and Foundation.Data.Doublets.Cli packages as the NUGET_API_KEY repository secret (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          # zizmor flags every --api-key push; the key is the short-lived
          # trusted-publishing key whenever vars.NUGET_USER is set.
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate # zizmor: ignore[use-trusted-publishing]
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify CLI package on NuGet
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        env:
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          node scripts/wait-for-nuget.mjs \
            --package-id "$PACKAGE_ID" \
            --release-version "$RELEASE_VERSION"

      - name: Verify library package on NuGet
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        env:
          PACKAGE_ID: ${{ steps.package.outputs.library_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          node scripts/wait-for-nuget.mjs \
            --package-id "$PACKAGE_ID" \
            --release-version "$RELEASE_VERSION"

      - name: Create GitHub Release
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
          CLI_PACKAGE_ID: ${{ steps.package.outputs.id }}
          LIBRARY_PACKAGE_ID: ${{ steps.package.outputs.library_id }}
        working-directory: .
        run: |
          node csharp/scripts/create-github-release.mjs \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-prefix "csharp-v" \
            --language "C#" \
            --package-id "$CLI_PACKAGE_ID" \
            --package-id "$LIBRARY_PACKAGE_ID" \
            --changelog-path "csharp/CHANGELOG.md" \
            --assets-glob "csharp/artifacts/*.nupkg"

  # === MANUAL CHANGESET PR ===
  # The workflow_dispatch input above advertises a 'changeset-pr' release mode,
  # but no job used to handle it: selecting it silently did nothing while the
  # run still reported success (issue #96). This job implements the advertised
  # mode - it opens a pull request carrying the changeset instead of releasing
  # straight away. The branch name matches the 'changeset-manual-release-*'
  # prefix that changeset-check already skips.
  changeset-pr:
    name: Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writer group: never cancel a run that may already have pushed a branch.
    concurrency:
      group: csharp-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Create changeset file
        working-directory: .
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CHANGESET_FILE="csharp/.changeset/manual-release-${RUN_ID}.md"
          DESCRIPTION_TEXT="${DESCRIPTION:-Manual ${BUMP_TYPE} release}"
          {
            echo '---'
            echo "'Foundation.Data.Doublets.Cli': ${BUMP_TYPE}"
            echo '---'
            echo
            echo "${DESCRIPTION_TEXT}"
          } > "$CHANGESET_FILE"
          echo "Created changeset: $CHANGESET_FILE"
          cat "$CHANGESET_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The automated release workflow will version, publish, and create a GitHub release
