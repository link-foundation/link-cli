name: JS client CI

# @link-foundation/link-cli-client (js/client, issue #108): unit tests and
# type checks, the conformance runner on Node.js, Bun and Deno against the
# Rust and C# `clink --serve` and the WebAssembly `Clink`, a smoke run of the
# synthetic consumer, and the npm release of the package.
on:
  # Only main on push: PR branches are covered by the pull_request trigger
  # (issue #96).
  push:
    branches:
      - main
    paths:
      - '.github/workflows/js-client.yml'
      - '.github/scripts/verify-npm-trust*'
      - '.github/scripts/check-sqlite-optional.mjs'
      - 'js/client/**'
      - 'rust/**'
      - 'csharp/**'
      - 'docs/protocol/**'
      - 'examples/cluster-csharp/**'
      - 'examples/sqlite-csharp/**'
      - 'examples/native-pages/**'
      - 'examples/native-pages-csharp/**'
      - 'examples/journal-checkpoints/**'
      - 'experiments/issue-138/generate-checkpoint-vectors.py'
      - 'experiments/issue-138/etcd-*.mjs'
      - 'experiments/issue-138/sqlite-adapter-contracts.mjs'
      - 'experiments/issue-138/make-native-page-vectors.py'
      - 'experiments/issue-138/make-mirrored-page-vectors.py'
      - 'experiments/issue-138/make-checkpoint-page-vectors.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/js-client.yml'
      - '.github/scripts/verify-npm-trust*'
      - '.github/scripts/check-sqlite-optional.mjs'
      - 'js/client/**'
      - 'rust/**'
      - 'csharp/**'
      - 'docs/protocol/**'
      - 'examples/cluster-csharp/**'
      - 'examples/sqlite-csharp/**'
      - 'examples/native-pages/**'
      - 'examples/native-pages-csharp/**'
      - 'examples/journal-checkpoints/**'
      - 'experiments/issue-138/generate-checkpoint-vectors.py'
      - 'experiments/issue-138/etcd-*.mjs'
      - 'experiments/issue-138/sqlite-adapter-contracts.mjs'
      - 'experiments/issue-138/make-native-page-vectors.py'
      - 'experiments/issue-138/make-mirrored-page-vectors.py'
      - 'experiments/issue-138/make-checkpoint-page-vectors.py'
  workflow_dispatch:
    inputs:
      verify_trusted_publishing:
        description: 'Verify npm OIDC authentication without publishing'
        type: boolean
        default: false

# Concurrency is set per job (issue #134): superseded read-only checks are
# cancelled on pull requests, while writer jobs share a never-cancelled
# group. A workflow-level group held the whole run, including the release
# and the registry wait, so a third push to main cancelled the queued run.

# Least privilege by default; the release job opts into more below.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify-trusted-publishing:
    name: Verify npm trusted publishing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_trusted_publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-verify-trusted-publishing
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Verify npm OIDC exchange
        run: node .github/scripts/verify-npm-trust.mjs

  unit:
    if: inputs.verify_trusted_publishing != true
    name: Unit tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-unit
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        working-directory: js/client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: js/client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Verify default imports and native logs need no SQLite
        run: node ../../.github/scripts/check-sqlite-optional.mjs js

      - name: Verify independently generated native page vectors
        run: |
          python3 ../../experiments/issue-138/make-native-page-vectors.py ../../experiments/issue-138/native-pages-regenerated.json
          cmp ../../docs/protocol/native-pages-v1.json ../../experiments/issue-138/native-pages-regenerated.json
          python3 ../../experiments/issue-138/make-mirrored-page-vectors.py ../../experiments/issue-138/mirrored-pages-regenerated.json
          cmp ../../docs/protocol/native-pages-mirrored-v1.json ../../experiments/issue-138/mirrored-pages-regenerated.json
          python3 ../../experiments/issue-138/generate-checkpoint-vectors.py ../../experiments/issue-138/engine-checkpoint-regenerated.json
          cmp ../../docs/protocol/engine-checkpoint-vectors.json ../../experiments/issue-138/engine-checkpoint-regenerated.json
          python3 ../../experiments/issue-138/make-checkpoint-page-vectors.py ../../experiments/issue-138/checkpoint-pages-regenerated.json
          cmp ../../docs/protocol/checkpoint-pages-v1.json ../../experiments/issue-138/checkpoint-pages-regenerated.json

      - name: Unit tests and complete production coverage
        run: >-
          node --test --test-concurrency=1 --test-timeout=30000
          --experimental-test-coverage --test-coverage-include='src/**'
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          test/*.test.mjs

      - name: Type declarations
        run: npm run typecheck

  conformance:
    if: inputs.verify_trusted_publishing != true
    name: Conformance on Node.js, Bun and Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-conformance
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      CLINK_RUST: ${{ github.workspace }}/rust/target/release/clink
      CLINK_CSHARP: ${{ github.workspace }}/csharp/Foundation.Data.Doublets.Cli/bin/Release/net10.0/clink
      CLINK_WASM: ${{ github.workspace }}/js/pkg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Portable checkpoint pages on Bun and Deno
        run: |
          bun test js/client/test/engine-checkpoint-pages.test.mjs --timeout 30000
          deno test --allow-all js/client/test/engine-checkpoint-pages.test.mjs

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/wasm/target
          key: ${{ runner.os }}-js-client-cargo-${{ hashFiles('rust/wasm/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-js-client-cargo-

      - name: Build the Rust server
        run: cargo build --release --manifest-path rust/Cargo.toml --features etcd --bin clink --example cluster

      - name: Build the C# server
        run: dotnet build csharp/Foundation.Data.Doublets.Cli --configuration Release

      - name: Build the WebAssembly store
        run: wasm-pack build --target web --out-dir ../../js/pkg rust/wasm

      - name: Build native coordinated example
        run: dotnet build examples/cluster-csharp --configuration Release

      - name: Verify actual consensus and language interoperability
        env:
          ETCD_BIN: ${{ github.workspace }}/experiments/issue-138/etcd/etcd-v3.7.3-linux-amd64/etcd
          CLUSTER_RUST_EXAMPLE: ${{ github.workspace }}/rust/target/release/examples/cluster
          CLUSTER_CSHARP_EXAMPLE: ${{ github.workspace }}/examples/cluster-csharp/bin/Release/net10.0/ClusterExample.dll
        run: |
          mkdir -p experiments/issue-138/etcd
          curl --fail --location --retry 3 --output experiments/issue-138/etcd/etcd-v3.7.3-linux-amd64.tar.gz https://github.com/etcd-io/etcd/releases/download/v3.7.3/etcd-v3.7.3-linux-amd64.tar.gz
          printf '%s  %s\n' '5dfa9cc3b3ce3b4b491fbcc2057d3daa166bcc6676f743fcd20f8e5760cb9775' 'experiments/issue-138/etcd/etcd-v3.7.3-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf experiments/issue-138/etcd/etcd-v3.7.3-linux-amd64.tar.gz -C experiments/issue-138/etcd
          node --test --test-timeout=10000 experiments/issue-138/etcd-harness.test.mjs
          node experiments/issue-138/etcd-cluster.mjs
          CLUSTER_JOURNAL_CHECKPOINT_INTERVAL=1 node experiments/issue-138/etcd-cluster.mjs

      - name: Verify finite checkpoint payloads with actual WASM
        run: |
          node examples/journal-checkpoints/measure.mjs > experiments/issue-138/checkpoint-node.json
          bun examples/journal-checkpoints/measure.mjs > experiments/issue-138/checkpoint-bun.json
          deno run --allow-all examples/journal-checkpoints/measure.mjs > experiments/issue-138/checkpoint-deno.json
          cmp experiments/issue-138/checkpoint-node.json experiments/issue-138/checkpoint-bun.json
          cmp experiments/issue-138/checkpoint-node.json experiments/issue-138/checkpoint-deno.json

      - name: Verify checkpoint and physical delta composition with actual WASM
        run: |
          node examples/journal-checkpoints/delta.mjs > experiments/issue-138/checkpoint-delta-node.json
          bun examples/journal-checkpoints/delta.mjs > experiments/issue-138/checkpoint-delta-bun.json
          deno run --allow-all examples/journal-checkpoints/delta.mjs > experiments/issue-138/checkpoint-delta-deno.json
          cmp experiments/issue-138/checkpoint-delta-node.json experiments/issue-138/checkpoint-delta-bun.json
          cmp experiments/issue-138/checkpoint-delta-node.json experiments/issue-138/checkpoint-delta-deno.json

      - name: Preserve checkpoint payload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-138-checkpoint-payloads
          path: experiments/issue-138/checkpoint-*.json
          if-no-files-found: ignore

      - name: Preserve consensus member logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-138-etcd-logs
          path: experiments/issue-138/etcd/run-*/*.log
          if-no-files-found: ignore

      - name: Conformance on Node.js
        working-directory: js/client
        run: node test/conformance/run.mjs

      - name: Conformance on Bun
        working-directory: js/client
        run: bun test/conformance/run.mjs

      - name: Conformance on Deno
        working-directory: js/client
        run: deno run --allow-all test/conformance/run.mjs

      - name: SQLite journal providers and cross-language reopening
        env:
          CLINK_WASM: ${{ github.workspace }}/js/pkg
        run: |
          node experiments/issue-138/sqlite-adapter-contracts.mjs
          bun experiments/issue-138/sqlite-adapter-contracts.mjs
          deno run --allow-all experiments/issue-138/sqlite-adapter-contracts.mjs
          cargo build --release --manifest-path rust/Cargo.toml --features sqlite --example engine_sqlite
          dotnet build examples/sqlite-csharp --configuration Release
          sqlite_data=$(mktemp -d)
          for validation in scan indexed; do
            for structure in shared flat; do
              for encoding in changes snapshot; do
                for physical in plain delta; do
                  flags=(--references)
                  if [[ "$validation" == indexed ]]; then flags+=(--indexed-constraints); fi
                  if [[ "$structure" == flat ]]; then flags+=(--flat); fi
                  if [[ "$encoding" == snapshot ]]; then flags+=(--snapshot); fi
                  if [[ "$physical" == delta ]]; then flags+=(--delta); fi
                  database="$sqlite_data/$validation-$structure-$encoding-$physical.db"
                  rust/target/release/examples/engine_sqlite "$database" "${flags[@]}"
                  dotnet examples/sqlite-csharp/bin/Release/net10.0/SqliteExample.dll "$database" "${flags[@]}"
                  node js/client/examples/engine-sqlite.mjs "$database" "${flags[@]}"
                  bun js/client/examples/engine-sqlite.mjs "$database" "${flags[@]}"
                  deno run --allow-all js/client/examples/engine-sqlite.mjs "$database" "${flags[@]}"
                done
              done
            done
          done

      - name: Native doublets pages and cross-language reopening
        env:
          CLINK_WASM: ${{ github.workspace }}/js/pkg
          NATIVE_PAGES_RUST_EXAMPLE: ${{ github.workspace }}/rust/target/release/examples/engine_native_pages
          NATIVE_PAGES_CSHARP_EXAMPLE: ${{ github.workspace }}/examples/native-pages-csharp/bin/Release/net10.0/NativePagesExample.dll
        run: |
          cargo build --release --manifest-path rust/Cargo.toml --no-default-features --features native-pages --example engine_native_pages
          dotnet build examples/native-pages-csharp --configuration Release
          bash examples/native-pages/run-interop.sh
          bash examples/journal-checkpoints/run-paged-interop.sh

      - name: Preserve native checkpoint page handoffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-138-checkpoint-pages
          path: experiments/issue-138/checkpoint-paged-interop.log
          if-no-files-found: ignore

      # A small run of the acceptance benchmark: it exits non-zero unless a
      # fresh client reads back exactly what was written. Full-size numbers
      # live in docs/case-studies/issue-108.
      - name: Synthetic consumer smoke run
        working-directory: js/client
        run: |
          node examples/synthetic-consumer.mjs --backend rust --records 40
          bun examples/synthetic-consumer.mjs --backend csharp --records 40
          deno run --allow-all examples/synthetic-consumer.mjs --backend wasm --records 40

  release:
    name: Release to npm
    needs: [unit, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writer group: never cancel a publish that may already be under way.
    concurrency:
      group: npm-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Trusted publishing and npm provenance use a GitHub OIDC token.
      id-token: write
    defaults:
      run:
        working-directory: js/client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether this version is published
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Only E404 means "not published". Any other failure (an unreachable
          # registry, a 5xx after npm's own retries) used to count as "not on
          # npm yet", so main then tried to publish an existing version.
          if output=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'code E404' <<< "$output"; then
            echo "$name@$version is not on npm yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            echo "::error title=npm lookup failed::Could not ask npm whether $name@$version is published. How to fix: re-run the job."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pull requests check what would be published, without a token.
      - name: Dry-run the release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          PUBLISHED: ${{ steps.check.outputs.published }}
        run: |
          # npm publish --dry-run still rejects an existing registry version.
          # Validate the tarball on those PRs without trying to republish it.
          if [ "$PUBLISHED" == 'true' ]; then
            npm pack --dry-run
          else
            npm publish --dry-run --access public
          fi

      # The package's OIDC policy is verified through the authentication-only
      # dispatch above (issue #136). No long-lived publishing token is used.
      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check.outputs.published == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] -- exact pinned release, see below
          # Trusted publishing needs npm 11.5.1+, newer than the npm bundled
          # with Node.js 24. Pinned to an exact release, and to the 11 line
          # because npm 12 requires Node.js ^24.15.0, which the runner's
          # cached 24.x need not satisfy.
          npm install --global npm@11.21.1
          if npm publish --access public --provenance --loglevel verbose; then
            exit 0
          fi
          echo "::error title=npm trusted publishing failed::@link-foundation/link-cli-client $VERSION could not be published. Check the js-client.yml trusted publisher policy on npmjs.com (including permission to publish directly), then run the authentication-only verification dispatch and retry."
          exit 1
