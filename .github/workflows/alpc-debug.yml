name: ALPC debug (temporary)

# Temporary: traces the Windows ALPC transport while it is being fixed (#140).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/alpc-debug.yml'
      - 'rust/src/protocol/ipc/**'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  alpc:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trace the ALPC test
        env:
          CLINK_IPC_TRACE: '1'
          RUST_BACKTRACE: '1'
        run: cargo test --lib alpc_echoes -- --nocapture --test-threads 1
