name: WebAssembly CI

on:
  # Only main on push: PR branches are covered by the pull_request trigger, and
  # listing them here made every push to an issue-* branch run this workflow
  # twice (issue #96).
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wasm.yml'
      - 'experiments/issue-138/wasm-coverage.sh'
      - 'js/**'
      - 'rust/**'
      - 'docs/protocol/native-pages*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wasm.yml'
      - 'experiments/issue-138/wasm-coverage.sh'
      - 'js/**'
      - 'rust/**'
      - 'docs/protocol/native-pages*'
  workflow_dispatch:

# Concurrency is set per job (issue #134): superseded read-only checks are
# cancelled on pull requests, while writer jobs share a never-cancelled
# group. A workflow-level group held the whole run, including the release
# and the registry wait, so a third push to main cancelled the queued run.

permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/wasm/target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('rust/wasm/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Install npm dependencies
        working-directory: js
        run: npm ci

      - name: Test Rust CLI core
        run: cargo test --manifest-path rust/Cargo.toml --all-features

      - name: Test WebAssembly wrapper
        working-directory: js
        run: npm run test:wasm

      # js/test/*.test.mjs existed but no workflow ever ran it, so repository
      # layout regressions passed CI unnoticed (issue #96).
      - name: Test JavaScript
        working-directory: js
        run: npm run test:js

      - name: Build React WebAssembly app
        working-directory: js
        run: npm run build

      - name: Upload built app
        uses: actions/upload-artifact@v7
        with:
          name: link-cli-web
          path: dist/

  coverage:
    name: WASM coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-coverage
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup matching WASM coverage tools
        # minicov 0.3.8 and wasm-bindgen-test 0.3.79 use LLVM 22's profile
        # layout. This pin applies only to coverage; production uses stable.
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update --target wasm32-unknown-unknown --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Measure actual WebAssembly tests
        run: bash experiments/issue-138/wasm-coverage.sh

      - name: Preserve WASM coverage report
        uses: actions/upload-artifact@v7
        with:
          name: wasm-coverage
          path: experiments/issue-138/wasm-coverage.json
          if-no-files-found: error

  # GitHub Pages is published by docs.yml alone: it assembles this workbench
  # together with the C# and Rust API references into a single artifact. This
  # workflow used to deploy the workbench on its own, which replaced the docs
  # already published at /csharp/ and /rust/ (issue #96).
