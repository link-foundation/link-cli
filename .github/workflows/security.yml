name: Security

# Mirrors the security workflow shared by the C#, Rust and JS
# ai-driven-development-pipeline templates, merged into a single file because
# this repository ships all three languages (issue #96).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Cached overlay-base SARIF retains extraction diagnostics from the base
    # even after the PR repairs the source (confirmed in run 42133108866).
    # A full database makes the completeness gate describe this checkout.
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # build-mode has to be declared per language. Leaving it unset made every
      # run log "Cannot build an overlay database because build-mode is set to
      # 'undefined'" and fall back to a full database, and drove the standalone
      # autobuild step, whose inputs the action now reports as DEPRECATED
      # (issue #96). C# used `autobuild`, which still logged "Cannot build an
      # overlay-base database because build-mode is set to "autobuild" instead
      # of "none"" on every run (issue #134); buildless extraction is supported
      # for C#, so every language is now analysed from source.
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Buildless C# extraction still restores NuGet packages to resolve
      # dependency types, so the SDK stays.
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # With build-mode set here the action builds the database itself, so the
      # deprecated github/codeql-action/autobuild step is no longer needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # Opt in when an upload/extraction fails without useful diagnostics.
          debug: ${{ vars.CI_VERBOSE == 'true' }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Require complete analysis without unresolved findings
        run: node .github/scripts/check-codeql-results.mjs codeql-results

      - name: Preserve SARIF for investigation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/**/*.sarif
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  cargo-audit:
    name: Cargo audit (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-cargo-audit-${{ matrix.manifest }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        manifest: [rust, rust/wasm, docs/case-studies/issue-100/evidence/external-range/rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2

      # `unmaintained`, `unsound` and `yanked` advisories are warnings, and a
      # warning does not move `cargo audit`'s exit status: it prints
      # "warning: N allowed warnings found" and exits 0, so the job passed while
      # showing findings (issue #134). Ported from the
      # rust-ai-driven-development-pipeline-template.
      - name: Audit committed Cargo.lock
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo audit --file "$MANIFEST/Cargo.lock" --deny warnings

  npm-audit:
    strategy:
      fail-fast: false
      matrix:
        directory: [js, js/client]
    name: Audit npm lock (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit-${{ matrix.directory }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Audit current lock
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=high

  nuget-audit:
    name: Audit every NuGet dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-nuget-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Audit direct and transitive packages and validate the complete result
        run: node .github/scripts/audit-nuget-dependencies.mjs
      - name: Preserve dependency graphs and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nuget-audit
          path: artifacts/security
          if-no-files-found: error

  python-audit:
    name: Audit resolved Python CI tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-python-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Audit pinned tools and their resolved dependencies
        run: pipx run pip-audit==2.10.1 --strict --requirement .github/scripts/requirements-quality.txt

  # === COMMITTED SECRETS ===
  # CodeQL and the audit jobs look at code and dependencies; nothing looked at
  # the literal contents of the tree. This repository commits CI evidence under
  # dev/log, which is exactly where a token pasted from a workflow log would end
  # up unnoticed (issue #96). Ported from the pipeline templates' secrets-scan
  # job. Git inventories tracked files, including force-added logs/experiments;
  # build-output ignores must never hide committed evidence from this scan.
  secrets-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Install locked secret scanner
        run: npm ci --prefix js --ignore-scripts
      - name: Run secretlint on every tracked file
        run: node .github/scripts/check-secrets.mjs
      - name: Verify ignored-log regression
        run: node experiments/issue-165/reproduce-ignored-secret.mjs

  pipeline-status:
    name: Pipeline Status (security)
    needs:
      - codeql
      - dependency-review
      - cargo-audit
      - npm-audit
      - nuget-audit
      - python-audit
      - secrets-scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check every prerequisite
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/pipeline-status.mjs
