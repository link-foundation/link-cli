name: Security

# Mirrors the security workflow shared by the C#, Rust and JS
# ai-driven-development-pipeline templates, merged into a single file because
# this repository ships all three languages (issue #96).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # build-mode has to be declared per language. Leaving it unset made every
      # run log "Cannot build an overlay database because build-mode is set to
      # 'undefined'" and fall back to a full database, and drove the standalone
      # autobuild step, whose inputs the action now reports as DEPRECATED
      # (issue #96). C# used `autobuild`, which still logged "Cannot build an
      # overlay-base database because build-mode is set to "autobuild" instead
      # of "none"" on every run (issue #134); buildless extraction is supported
      # for C#, so every language is now analysed from source.
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Buildless C# extraction still restores NuGet packages to resolve
      # dependency types, so the SDK stays.
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.

      # With build-mode set here the action builds the database itself, so the
      # deprecated github/codeql-action/autobuild step is no longer needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  cargo-audit:
    name: Cargo audit (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-cargo-audit-${{ matrix.manifest }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        manifest: [rust, rust/wasm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2

      # `unmaintained`, `unsound` and `yanked` advisories are warnings, and a
      # warning does not move `cargo audit`'s exit status: it prints
      # "warning: N allowed warnings found" and exits 0, so the job passed while
      # showing findings (issue #134). Ported from the
      # rust-ai-driven-development-pipeline-template.
      - name: Audit committed Cargo.lock
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo audit --file "$MANIFEST/Cargo.lock" --deny warnings

  npm-audit:
    name: Audit npm lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Audit current lock
        working-directory: js
        run: npm audit --package-lock-only --audit-level=high

  # === COMMITTED SECRETS ===
  # CodeQL and the audit jobs look at code and dependencies; nothing looked at
  # the literal contents of the tree. This repository commits CI evidence under
  # dev/log, which is exactly where a token pasted from a workflow log would end
  # up unnoticed (issue #96). Ported from the pipeline templates' secrets-scan
  # job. .gitignore doubles as the ignore file, so node_modules and build output
  # are skipped.
  secrets-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"
