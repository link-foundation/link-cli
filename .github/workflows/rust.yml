name: Rust CI/CD Pipeline

on:
  push:
    branches:
      - main
  # No path filter (issue #111): the JavaScript stage and the parity check
  # must run for every pull request, and "Pipeline Status (rust)" is a
  # required check that a filtered-out run would never report. The
  # detect-changes job skips the Rust jobs when no Rust input changed
  # (.github/scripts/stack-paths.mjs).
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
          - verify-trusted-publishing
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Concurrency is set per job (issue #134): superseded read-only checks are
# cancelled on every branch, main included (issue #172), while writer jobs
# share a never-cancelled group. A workflow-level group held the whole run,
# including the release and the registry wait, so a third push to main
# cancelled the queued run.

# Least privilege by default; the publishing jobs opt into more below.
permissions:
  contents: read

# The GIT_CONFIG_* entries provide Git config to actions/checkout itself;
# checkout runs git init before any workflow step can configure Git, which
# otherwise prints the default-branch hint into every log.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # === STAGE GATE (issue #111) ===
  # Lint, JavaScript unit tests and the parity check. Every job that installs
  # Rust lists `javascript` in its needs, so nothing Rust starts unless this
  # stage succeeded for the same commit.
  javascript:
    name: javascript
    if: inputs.release_mode != 'verify-trusted-publishing'
    uses: ./.github/workflows/javascript-stage.yml

  release-preflight:
    name: Release authentication preflight
    if: inputs.release_mode != 'verify-trusted-publishing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-release-preflight
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Authenticate preflight with crates.io
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && github.event_name != 'pull_request' && inputs.release_mode != 'changelog-pr' && inputs.release_mode != 'changeset-pr'
        id: preflight_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Prove authentication before version writes or publishing
        working-directory: .
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          CARGO_REGISTRY_TOKEN: ${{ github.event_name != 'pull_request' && (steps.preflight_auth.outputs.token || secrets.CARGO_TOKEN) || '' }}
        run: node .github/scripts/release-preflight.mjs crates

  # Authenticate without a version commit, tag, or package upload. This lets
  # maintainers verify the registry policy before retiring the token fallback.
  verify-trusted-publishing:
    name: Verify crates.io trusted publishing
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'verify-trusted-publishing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-verify-trusted-publishing
      cancel-in-progress: true
    steps:
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Confirm short-lived credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          echo 'crates.io OIDC authentication succeeded; the action revokes its temporary token when this job ends.' >> "$GITHUB_STEP_SUMMARY"

  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    needs: [javascript]
    if: github.event_name != 'workflow_dispatch'
    outputs:
      stack-changed: ${{ steps.stack.outputs.stack-changed }}
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
      rust-code-changed: ${{ steps.changes.outputs.rust-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: rust-script rust/scripts/detect-code-changes.rs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      # Replaces the removed pull_request path filter: on a pull request
      # that changes no Rust input, lint (and with it test, build and
      # fresh-merge), coverage and the changelog check are skipped.
      - name: Detect whether the Rust stack changed
        id: stack
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_PATHS_DEBUG: ${{ runner.debug }}
        run: node .github/scripts/stack-paths.mjs rust

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: true
    needs: [javascript, detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.stack-changed == 'true' && needs.detect-changes.outputs.rust-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          RUST_ROOT: rust
        run: rust-script rust/scripts/check-changelog-fragment.rs

  # === LINT AND FORMAT CHECK ===
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    needs: [javascript, detect-changes]
    if: |
      !cancelled() && needs.javascript.result == 'success' && inputs.release_mode != 'verify-trusted-publishing' && (
        github.event_name != 'pull_request' || needs.detect-changes.outputs.stack-changed == 'true'
      ) && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/wasm/Cargo.toml --all -- --check

      # `-D warnings` is what makes this a gate: without it clippy prints its
      # findings and still exits 0, so lint warnings accumulated invisibly
      # (issue #96). The wasm crate is a separate workspace and was not linted
      # at all until now.
      - name: Run Clippy
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust/wasm/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check file size limit
        run: rust-script rust/scripts/check-file-size.rs

      # The release scripts commit and push straight to main, where no
      # workflow re-checks their output; their own test suites are the gate
      # (issue #134: a silently failing `git add` released 1.0.6-1.0.8
      # without ever committing the version bump).
      - name: Compile release scripts (non-test, warnings denied)
        run: bash rust/scripts/check-scripts.sh

      - name: Test release scripts
        run: bash rust/scripts/test-scripts.sh

      # A dependency bump in Cargo.toml without the matching Cargo.lock update
      # otherwise passes CI while every job silently re-resolves the graph
      # (issue #96). --locked turns that drift into a failure.
      - name: Deny Cargo manifest warnings
        run: |
          bash .github/scripts/check-cargo-warnings.sh --manifest-path rust/Cargo.toml
          bash .github/scripts/check-cargo-warnings.sh --manifest-path rust/wasm/Cargo.toml

      - name: Verify Cargo.lock is up to date
        run: |
          cargo metadata --locked --format-version 1 --manifest-path rust/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path rust/wasm/Cargo.toml > /dev/null

      # The workflow policy tests (issue #96) moved to the JavaScript stage,
      # which runs them through `npm run test:js` before this job starts.

      # Pull request caches are scoped to their merge ref, so only main
      # saves; every branch restores main's cache (issue #172).
      - name: Save cargo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # === TEST ===
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    needs: [javascript, detect-changes, changelog, lint]
    if: ${{ !cancelled() && needs.javascript.result == 'success' && needs.lint.result == 'success' && inputs.release_mode != 'verify-trusted-publishing' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # Its own key: sharing the lint job's key let lint's clippy-only
          # cache win the save race, so tests restored almost nothing.
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Setup Node.js for dependency boundary checks
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Verify SQLite is optional
        run: node .github/scripts/check-sqlite-optional.mjs rust

      # Compile everything first and save the cache before the long test
      # run, so saving (3-5 minutes for ~3 GB on Windows) can never be what
      # pushes a job whose tests passed past timeout-minutes (issue #172).
      - name: Build test binaries
        shell: bash
        run: |
          cargo test --manifest-path rust/Cargo.toml --no-default-features --test doublets_storage_tests --test engine_journal_tests --no-run
          cargo test --manifest-path rust/Cargo.toml --all-features --no-run
          cargo build --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm

      # Pull request caches are scoped to their merge ref, so only main
      # saves; every branch restores main's cache (issue #172).
      - name: Save cargo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Test native stores without optional providers
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features --test doublets_storage_tests --test engine_journal_tests

      # golden_fixtures_tests writes the receipt that the next step checks,
      # so a filtered or skipped golden fixture test fails CI (issue #111).
      - name: Run tests
        env:
          GOLDEN_FIXTURES_RECEIPT: ${{ runner.temp }}/golden-rust.json
        run: cargo test --manifest-path rust/Cargo.toml --all-features --verbose

      - name: Check that the Rust suite loaded every golden fixture
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/golden-rust.json
        run: node parity/check-parity.mjs --receipt rust "$RECEIPT"

      - name: Run doc tests
        run: cargo test --manifest-path rust/Cargo.toml --doc --verbose

      - name: Native LSM cluster consumers without SQL or a coordinator
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm
          cargo run --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm -- cluster direct
          cargo run --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm -- cluster partitioned
          cargo run --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm -- cluster chunks
          cargo run --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm -- cluster reclaiming
          cargo run --manifest-path rust/Cargo.toml --no-default-features --features native-pages,physical-lsm --example native_lsm -- cluster reclaiming-chunks

  # === COVERAGE MEASUREMENT ===
  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-coverage
      cancel-in-progress: true
    needs: [javascript, detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.stack-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust coverage tools
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Measure Rust test coverage
        # Branch instrumentation is experimental. Limit the unstable compiler
        # option to this measurement; normal builds still use stable Rust.
        env:
          RUSTC_BOOTSTRAP: '1'
          # Crash tests kill child processes on purpose. A kill during the
          # child's exit leaves a truncated profile, which only loses that
          # child's counters, so it must not discard every other profile.
          LLVM_PROFDATA_FLAGS: --failure-mode=all
        run: |
          cargo llvm-cov --manifest-path rust/Cargo.toml --all-features --branch --lcov --output-path rust/coverage.lcov
          cargo llvm-cov report --manifest-path rust/Cargo.toml --branch --json --summary-only --output-path rust/coverage-summary.json

      - name: Check author guard coverage
        run: python3 experiments/issue-138/check-author-fence-rust-coverage.py rust/coverage-summary.json

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            rust/coverage.lcov
            rust/coverage-summary.json
          if-no-files-found: error

  # === SEMANTIC MERGE CONFLICT CHECK ===
  # Every other job tests the pull request head. A pull request can be green in
  # isolation and still break `main`: two changes that merge without a textual
  # conflict can still contradict each other semantically, and the breakage only
  # appears after the merge lands (issue #96). This job merges the head into the
  # current tip of the base branch and re-runs the fast checks on that tree.
  # Ported from the Rust pipeline template's "Simulate fresh merge" step.
  fresh-merge:
    name: Simulate Fresh Merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-fresh-merge
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    needs: [javascript, detect-changes, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-fresh-merge-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fresh-merge-

      - name: Simulate fresh merge with base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          FRESH_MERGE_CHECKS: |
            cargo fmt --manifest-path rust/Cargo.toml --all -- --check
            cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
            cargo test --manifest-path rust/Cargo.toml --all-features
        run: bash .github/scripts/simulate-fresh-merge.sh

      # Pull request caches are scoped to their merge ref, so only main
      # saves; every branch restores main's cache (issue #172).
      - name: Save cargo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # === BUILD ===
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    needs: [javascript, lint, test]
    if: ${{ !cancelled() && needs.javascript.result == 'success' && needs.lint.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --manifest-path rust/Cargo.toml --release --verbose

      - name: Check package
        run: cargo package --manifest-path rust/Cargo.toml --list --allow-dirty

      # Pull request caches are scoped to their merge ref, so only main
      # saves; every branch restores main's cache (issue #172).
      - name: Save cargo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # === AUTO RELEASE ===
  auto-release:
    name: Auto Release
    needs: [release-preflight, javascript, lint, test, build]
    if: ${{ !cancelled() && needs.release-preflight.result == 'success' && needs.javascript.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Writer group: never cancel a release that may already have published a
    # crate or pushed a version commit.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script rust/scripts/git-config.rs

      - name: Determine bump type from changelog fragments
        id: bump_type
        env:
          RUST_ROOT: rust
        run: rust-script rust/scripts/get-bump-type.rs

      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_ROOT: rust
        run: |
          rust-script rust/scripts/check-release-needed.rs \
            --tag-prefix rust-v \
            --repository "$GITHUB_REPOSITORY"

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        working-directory: .
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.bump_type }}
        run: |
          rust-script rust/scripts/version-and-commit.rs \
            --rust-root rust \
            --tag-prefix rust-v \
            --bump-type "$BUMP_TYPE"

      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        env:
          RUST_ROOT: rust
        run: rust-script rust/scripts/get-version.rs

      - name: Build release
        if: steps.check.outputs.should_release == 'true'
        run: cargo build --manifest-path rust/Cargo.toml --release

      # Trusted publishing runs only once it is configured on crates.io and
      # the CRATES_IO_TRUSTED_PUBLISHING repository variable is 'true'.
      # Attempting it unconditionally with continue-on-error left a red
      # "No Trusted Publishing config found" annotation on every green
      # release (issue #134). Without the variable the publish step uses the
      # CARGO_REGISTRY_TOKEN/CARGO_TOKEN secret and fails when it is missing.
      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: prm_auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && (steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true')

      - name: Publish to Crates.io
        id: publish_crate
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.prm_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          RUST_ROOT: rust
        run: rust-script rust/scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: steps.check.outputs.should_release == 'true'
        env:
          RUST_ROOT: rust
          RELEASE_VERSION: ${{ steps.current_version.outputs.version }}
        run: rust-script rust/scripts/wait-for-crate.rs --release-version "$RELEASE_VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          RELEASE_VERSION="${NEW_VERSION:-$CURRENT_VERSION}"

          rust-script rust/scripts/create-github-release.rs \
            --rust-root rust \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-prefix "rust-v" \
            --language "Rust"

  # === MANUAL RELEASE ===
  manual-release:
    name: Manual Release
    needs: [release-preflight, javascript, lint, test, build]
    if: ${{ !cancelled() && needs.release-preflight.result == 'success' && needs.javascript.result == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Writer group: never cancel a release that may already have published a
    # crate or pushed a version commit.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script rust/scripts/git-config.rs

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          rust-script rust/scripts/version-and-commit.rs \
            --rust-root rust \
            --tag-prefix rust-v \
            --bump-type "$BUMP_TYPE" \
            --description "$DESCRIPTION"

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --manifest-path rust/Cargo.toml --release

      # Trusted publishing runs only once it is configured on crates.io and
      # the CRATES_IO_TRUSTED_PUBLISHING repository variable is 'true'.
      # Attempting it unconditionally with continue-on-error left a red
      # "No Trusted Publishing config found" annotation on every green
      # release (issue #134). Without the variable the publish step uses the
      # CARGO_REGISTRY_TOKEN/CARGO_TOKEN secret and fails when it is missing.
      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: prm_auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && (steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true')

      - name: Publish to Crates.io
        id: publish_crate
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.prm_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          RUST_ROOT: rust
        run: rust-script rust/scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          RUST_ROOT: rust
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: rust-script rust/scripts/wait-for-crate.rs --release-version "$RELEASE_VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          rust-script rust/scripts/create-github-release.rs \
            --rust-root rust \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-prefix "rust-v" \
            --language "Rust"

  # === MANUAL CHANGELOG PR ===
  # Mirrors the C# 'changeset-pr' mode and the Rust pipeline template: instead of
  # releasing straight away, open a pull request carrying the changelog fragment
  # so the release goes through the normal review path (issue #96).
  changelog-pr:
    name: Create Changelog PR
    needs: [javascript]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writer group: never cancel a run that may already have pushed a branch.
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install rust-script
        run: bash rust/scripts/install-rust-script.sh

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          rust-script rust/scripts/create-changelog-fragment.rs \
            --rust-root rust \
            --bump-type "$BUMP_TYPE" \
            --description "$DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release

  pipeline-status:
    name: Pipeline Status (rust)
    needs:
      - javascript
      - release-preflight
      - verify-trusted-publishing
      - detect-changes
      - changelog
      - lint
      - coverage
      - test
      - fresh-merge
      - build
      - auto-release
      - manual-release
      - changelog-pr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check every prerequisite
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/pipeline-status.mjs
