name: Workflows

# Lints the CI/CD definitions themselves (issue #134). Before this workflow
# nothing ran actionlint or zizmor, and the workflow policy tests only ran
# when a C# or Rust path changed, so a defect in docs.yml, wasm.yml or
# links.yml reached main unchecked. Mirrors workflows.yml of the
# rust/csharp/js ai-driven-development-pipeline templates.
on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'js/**'
      - 'csharp/scripts/**'
      - 'examples/**'
      - 'experiments/**'
      - '.pre-commit-config.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
      - 'js/**'
      - 'csharp/scripts/**'
      - 'examples/**'
      - 'experiments/**'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

# Least-privilege default; these jobs only read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}-actionlint
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A native actionlint binary without shellcheck on
      # PATH silently skips the shell checks and exits 0. To reproduce locally:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      #
      # Pinned by digest because a mutable tag of a repository we do not
      # control is arbitrary code execution (the `'*': hash-pin` policy of
      # .github/zizmor.yml). Re-resolve when bumping:
      #   docker pull rhysd/actionlint:<tag> &&
      #   docker inspect --format='{{index .RepoDigests 0}}' rhysd/actionlint:<tag>
      # GitHub supports the writer queue. v1.7.12 rejects this key
      # (rhysd/actionlint#657); workflow policy tests validate it separately.
      - name: Lint workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: >-
            -color -ignore "unexpected key .queue. for .concurrency. section"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}-zizmor
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint cannot see workflow security defects: unpinned third-party
      # actions, checkouts that persist GITHUB_TOKEN in .git/config, or
      # template injection into `run:` blocks. zizmor covers those.
      #
      # Only .github is audited: dev/log keeps verbatim copies of the template
      # workflows as evidence, and they are not run here.
      #
      # The action's wheel lock can lag behind PyPI releases. Verify the
      # wheel against our own lock and share the install between both audits.
      - name: Install the locked zizmor wheel
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            --target "$RUNNER_TEMP/zizmor" -r .github/scripts/requirements-workflow-audit.txt

      # Emit annotations so findings fail the job without code scanning.
      - name: Audit workflow files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format github --config .github/zizmor.yml .github

      # The audits that cover container image references (`unpinned-images`
      # among them) are pedantic-only, so the hash-pin policy is not enforced
      # against `uses: docker://` by the regular pass above. Narrowing this
      # pass to high severity and high confidence keeps that enforcement
      # without the stylistic noise of the pedantic persona.
      - name: Audit for pedantic-only high-severity findings
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --config .github/zizmor.yml \
            --persona pedantic --min-severity high --min-confidence high \
            .github

  policy:
    name: Workflow Policy Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}-policy
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Run workflow policy tests
        run: node --test .github/scripts/*.test.mjs

  languages:
    name: JavaScript and Python lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}-languages
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked JavaScript tools
        run: npm ci --prefix js --ignore-scripts
      - name: Check all maintained JavaScript including JSX and examples
        run: npm --prefix js run lint
      - name: Install Python tools
        run: python -m pip install -r .github/scripts/requirements-quality.txt
      - name: Check all maintained Python and type-check runtime CI helpers
        run: python .github/scripts/check-python-quality.py

  pipeline-status:
    name: Pipeline Status (workflows)
    needs:
      - actionlint
      - zizmor
      - policy
      - languages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}-pipeline-status
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check every prerequisite
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/pipeline-status.mjs
