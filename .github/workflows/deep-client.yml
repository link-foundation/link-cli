name: DeepClient CI

# Issue #153: the real DeepClient of @deep-foundation/deeplinks against the
# Rust and C# `clink --serve --graphql`.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deep-client.yml'
      - '.github/scripts/**'
      - 'examples/deep-client/**'
      - 'docs/protocol/graphql/**'
      - 'rust/**'
      - 'csharp/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deep-client.yml'
      - '.github/scripts/**'
      - 'examples/deep-client/**'
      - 'docs/protocol/graphql/**'
      - 'rust/**'
      - 'csharp/**'

permissions:
  contents: read

# Provide Git config to actions/checkout itself.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === STAGE GATE (issue #111) ===
  # Jobs that install Rust or .NET wait for the JavaScript stage (lint,
  # `npm run test:js`, parity check) of the same commit; a failed, cancelled
  # or skipped stage leaves them skipped.
  javascript:
    name: javascript
    uses: ./.github/workflows/javascript-stage.yml

  deep-client:
    name: DeepClient (${{ matrix.implementation }})
    needs: [javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        implementation: [rust, csharp]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run against Rust
        if: matrix.implementation == 'rust'
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          examples/deep-client/run.sh "$PWD/rust/target/release/clink"
      - name: Set up .NET
        if: matrix.implementation == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403' # Exact version uses the public builds feed; channel redirect returns HTTP 409.
      - name: Run against C#
        if: matrix.implementation == 'csharp'
        run: |
          dotnet build csharp/Foundation.Data.Doublets.Cli --configuration Release
          examples/deep-client/run.sh "$PWD/csharp/Foundation.Data.Doublets.Cli/bin/Release/net10.0/clink"

  pipeline-status:
    name: Pipeline Status (deep-client)
    needs:
      - javascript
      - deep-client
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check every prerequisite
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/pipeline-status.mjs
