name: Dependencies

# Every dependency stays on its latest release (PR #106 review): Cargo crates
# and their lock files, NuGet packages, npm packages, GitHub Actions, and the
# Node.js and .NET versions the workflows set up. Dependabot
# (.github/dependabot.yml) opens the pull requests that bump them; this check
# fails while anything is still behind, on every pull request and daily on
# main, so a new upstream release is noticed within a day. A dependency that
# cannot be updated yet carries a comment linking the open issue that blocks
# it (issue #104); see the header of check-latest-dependencies.mjs.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # A dependency held back by a manifest comment links an issue; the check
  # reads that issue to make sure it is still open. The tracking-issue job
  # alone gets issues: write.
  issues: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git, which otherwise prints the
# default-branch hint into every log.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # === STAGE GATE (issue #111) ===
  # Jobs that install Rust or .NET wait for the JavaScript stage (lint,
  # `npm run test:js`, parity check) of the same commit; a failed, cancelled
  # or skipped stage leaves them skipped.
  javascript:
    name: javascript
    uses: ./.github/workflows/javascript-stage.yml

  latest:
    name: Dependencies are on their latest versions
    needs: [javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Compare every dependency with its registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_DEPENDENCIES_MODE: ${{ github.event_name == 'pull_request' && 'enforce' || 'report' }}
        run: node .github/scripts/check-latest-dependencies.mjs

  # A red check on main used to stay silently red (issue #111): the daily
  # runs of 2026-10-08 and 2026-10-09 failed and nobody acted. A failure on
  # main now opens or updates a tracking issue, and the next passing run on
  # main closes it. TRACKING_ISSUE_DEBUG logs each API call when the run is
  # re-run with debug logging.
  tracking-issue:
    name: Track a red check on main
    needs:
      - javascript
      - latest
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Open, update or close the tracking issue
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACKING_ISSUE_DEBUG: ${{ runner.debug }}
        run: node .github/scripts/dependency-tracking-issue.mjs

  pipeline-status:
    name: Pipeline Status (dependencies)
    needs:
      - javascript
      - latest
      - tracking-issue
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check every prerequisite
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/pipeline-status.mjs
