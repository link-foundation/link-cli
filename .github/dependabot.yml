# Opens the pull requests that keep every dependency on its latest release.
# .github/workflows/dependencies.yml fails while anything is still behind.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ['/rust', '/rust/wasm']
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ['*']
