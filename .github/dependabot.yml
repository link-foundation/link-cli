# Opens the pull requests that keep every dependency on its latest release.
# .github/workflows/dependencies.yml fails while anything is still behind, in
# every manifest git tracks, so every directory with one is listed here.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /rust
      - /rust/wasm
      - /experiments/issue-138/lsm-store-before-rust
      - /experiments/issue-138/mapped-grow-failure
      - /docs/case-studies/issue-100/evidence/external-range/rust
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - /csharp
      - /examples/lino-structure-probe
      - /examples/sqlite-csharp
      - /experiments/issue-138/lsm-store-before-csharp
      - /docs/case-studies/issue-100/evidence/csharp-merge-usages
      - /docs/case-studies/issue-100/evidence/external-range/csharp
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /js
      - /js/client
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ['*']
