[package]
name = "clink-wasm"
version = "2.4.0"
# Built by wasm-pack for the browser workbench; not distributed on crates.io.
publish = false
authors = ["link-foundation"]
edition = "2021"
description = "Browser WebAssembly wrapper for the Rust link-cli core"
license = "Unlicense"
repository = "https://github.com/link-foundation/link-cli"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
link-cli = { path = ".." }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
console_error_panic_hook = { version = "0.1.7", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
links-notation = "0.27.1"

# The cdylib is linked before the test executable. It therefore needs the
# profiling runtime itself when collecting experimental WASM coverage.
[target.'cfg(all(target_arch = "wasm32", wasm_bindgen_unstable_test_coverage))'.dependencies]
minicov = "=0.3.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

[dependencies.web-sys]
version = "0.3.106"
features = [
  "console",
]

[features]
default = ["console_error_panic_hook"]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
