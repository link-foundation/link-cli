[package]
name = "clink-wasm"
version = "2.4.0"
# Built by wasm-pack for the browser workbench; not distributed on crates.io.
publish = false
authors = ["link-foundation"]
edition = "2021"
description = "Browser WebAssembly wrapper for the Rust link-cli core"
license = "Unlicense"
repository = "https://github.com/link-foundation/link-cli"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
link-cli = { path = ".." }
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
links-notation = "0.31.3"

# Only the wasm32 entry point installs the panic hook (src/lib.rs), so a host
# build would report the dependency as unused (cargo::unused_dependencies).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }

# The cdylib is linked before the test executable. It therefore needs the
# profiling runtime itself when collecting experimental WASM coverage.
[target.'cfg(all(target_arch = "wasm32", wasm_bindgen_unstable_test_coverage))'.dependencies]
minicov = "=0.3.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

[features]
default = ["console_error_panic_hook", "sorted-tables", "physical-lsm", "causal", "causal-merkle", "causal-batches", "causal-projection", "causal-sessions", "address-reservations", "author-fencing"]
address-reservations = ["link-cli/address-reservations"]
author-fencing = ["link-cli/author-fencing"]
causal = ["link-cli/causal"]
causal-batches = ["causal", "link-cli/causal-batches"]
causal-sessions = ["causal-batches", "causal-projection", "link-cli/causal-sessions"]
causal-projection = ["causal", "link-cli/causal-projection"]
causal-merkle = ["causal", "link-cli/causal-merkle"]
sorted-tables = ["link-cli/sorted-tables"]
physical-lsm = ["link-cli/physical-lsm"]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
