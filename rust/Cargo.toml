[package]
name = "link-cli"
version = "3.0.0"
edition = "2021"
# `std::fs::File::lock` (used by the advisory locking in `storage::lock`)
# was stabilised in Rust 1.89.
rust-version = "1.89"
description = "A CLI tool and reusable library for links manipulation backed by a LiNo-notation doublet storage engine."
license = "Unlicense"
repository = "https://github.com/link-foundation/link-cli"
documentation = "https://docs.rs/link-cli"
homepage = "https://github.com/link-foundation/link-cli"
readme = "README.md"
authors = ["link-foundation"]
keywords = ["links", "doublets", "cli", "database"]
categories = ["command-line-utilities", "database", "data-structures"]

[lib]
name = "link_cli"
path = "src/lib.rs"

[[bin]]
name = "clink"
path = "src/main.rs"

# A normal test harness writes to stdout before invoking a child test, which
# prevents exercising library stdout failures against /dev/full.
[[test]]
name = "diagnostic_stdout"
harness = false

[dependencies]
thiserror = "2.0.21"
anyhow = "1.0.104"
# Native std::time semantics, JavaScript Date.now for browser/Node WASM.
web-time = "1.1.0"
# Optional engine strategy uses the maintained Arc-based persistent ordered map.
rpds = "1.2.1"
# Optional runtime object caching reuses bounded LRU ordering; std hashing only.
lru = { version = "0.19.0", default-features = false }
# Issue 67 Rust basis crates:
# Source: http://github.com/linksplatform/doublets-rs
doublets = "0.21.0"
# Source: http://github.com/link-foundation/links-notation
links-notation = "0.31.3"
# Source: http://github.com/link-foundation/lino-arguments
lino-arguments = "0.5.0"
ureq = { version = "3.5.1", features = ["json"], optional = true }
base64 = { version = "0.23.1", optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = { version = "0.11.1", default-features = false }
# `_regex` and `_iregex` of Hasura comparison expressions.
regex-lite = "0.1.9"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Lets `clink --serve` stop cleanly on Ctrl-C and on termination signals.
ctrlc = { version = "3.5.2", features = ["termination"] }
# Selected physical pager/WAL component; absent from default/native and WASM builds.
getrandom = { version = "0.4.3", optional = true }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"], optional = true }

[target.'cfg(unix)'.dependencies]
# POSIX IPC transports (`protocol::ipc`): FIFOs, shared memory, signals and
# message queues; also the native page store.
libc = "0.2.191"
errno = "0.3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_Security",
    # Windows IPC transports (`protocol::ipc`).
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Mailslots",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
address-reservations = ["dep:serde_json"]
author-fencing = ["dep:serde_json"]
causal = ["dep:serde_json"]
causal-batches = ["causal"]
causal-sessions = ["causal-batches", "causal-projection"]
causal-projection = ["causal"]
causal-merkle = ["causal"]
etcd = ["dep:ureq", "dep:base64", "dep:serde_json"]
sqlite = ["dep:rusqlite"]
native-pages = ["dep:getrandom"]
sorted-tables = ["dep:serde_json"]
physical-lsm = ["sorted-tables"]

[[example]]
name = "cluster"
required-features = ["etcd"]

[[example]]
name = "address_allocation"
required-features = ["etcd", "address-reservations"]

[[example]]
name = "engine_sqlite"
required-features = ["sqlite"]

[[example]]
name = "engine_native_pages"
required-features = ["native-pages"]

[[example]]
name = "journal_maintenance"
required-features = ["etcd"]

[[example]]
name = "journal_reclamation"
required-features = ["etcd"]

[[example]]
name = "sorted_table"
required-features = ["native-pages", "sorted-tables"]

[[example]]
name = "native_lsm"
required-features = ["native-pages", "physical-lsm"]

[[example]]
name = "author_fence"
required-features = ["etcd", "author-fencing"]
